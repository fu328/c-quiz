<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>C 语言刷题助手</title>
    <script>
      // 在首屏渲染前应用主题，避免闪烁
      (function () {
        try {
          var cfg = JSON.parse(localStorage.getItem('cquiz.theme') || '"system"');
          var dark = cfg === 'dark' || (cfg !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
